<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Planar Gate — Dank Omphalos Arthouse</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#0C0A14;--paper:#181321;--ink:#ECE6F0;--muted:#9C90AC;--line:#2C2438;
        --oxblood:#8A2433;--brass:#E2A24E;--good:#43BCB0;
        --display:'Cinzel',Georgia,serif;--serif:'Cormorant Garamond',Georgia,serif;--sans:'EB Garamond',Georgia,serif}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;
       background-image:radial-gradient(1100px 620px at 6% -6%,rgba(217,99,58,.12),transparent 58%),
                        radial-gradient(1000px 600px at 100% 108%,rgba(67,188,176,.10),transparent 58%);background-attachment:fixed}
  a{color:inherit} .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  header{position:sticky;top:0;z-index:20;background:rgba(11,9,12,.82);backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
         text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:12px;white-space:nowrap}
  .brand .mark{width:24px;height:24px;border-radius:50%;background:url('assets/dankomphalosicon.jpg') center/cover;
       box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),0 0 12px rgba(226,162,78,.22)}
  section.block{padding:48px 0}
  .head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
  .head h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0}
  .lead{max-width:640px;color:var(--muted);margin:0 0 24px}
  .portal-head{padding-top:40px;margin:0 0 4px}
  .portal-head h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:0}
  .portal-head h2.pg-title{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,50px);letter-spacing:.05em;text-transform:uppercase;line-height:1.02}
  .pg-sub{font-family:var(--display);font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--brass);margin:9px 0 0}
  .btn{display:inline-block;font-size:14px;letter-spacing:.05em;text-decoration:none;font-weight:500;padding:13px 22px;border-radius:2px;
       border:1px solid var(--brass);background:var(--brass);color:#1A1206;cursor:pointer;font-family:var(--sans)}
  .btn.ghost{background:transparent;color:var(--brass)}
  input[type=email]{width:100%;padding:13px 14px;margin:0 0 12px;background:var(--paper);border:1px solid var(--line);
       border-radius:3px;color:var(--ink);font-family:var(--sans);font-size:16px}
  .fld{margin:0 0 18px}
  .fld-top{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 6px;gap:12px}
  .fld-top label{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .fld .vis{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
  .fld .vis input{accent-color:var(--brass)}
  .fld input[type=text],.fld textarea{width:100%;padding:12px 14px;background:var(--paper);border:1px solid var(--line);
       border-radius:3px;color:var(--ink);font-family:var(--sans);font-size:16px}
  .fld textarea{min-height:92px;resize:vertical;line-height:1.5}
  .ok{color:var(--good)}
  .err{color:#E8909C;background:rgba(138,36,51,.14);border:1px solid var(--oxblood);border-radius:4px;padding:14px 16px;white-space:pre-wrap;font-size:13px;font-family:ui-monospace,monospace}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0 32px}
  @media(max-width:680px){.summary{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:15px 17px}
  .stat .n{font-family:var(--serif);font-size:25px;margin:0 0 3px}.stat .l{font-size:12px;color:var(--muted);margin:0}
  .stat.hl{border-color:var(--brass)}.stat.hl .n{color:var(--brass)}
  .ledger{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 14px}
  .ledger th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:0 10px 10px}
  .ledger td{border-bottom:1px solid var(--line);padding:12px 10px;vertical-align:top}.ledger tr:last-child td{border-bottom:0}
  .ledger .owed{color:var(--good);font-family:var(--serif);font-size:16px}.muted{color:var(--muted)}
  .sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  footer{border-top:1px solid var(--line);background:var(--paper);margin-top:40px}
  footer .wrap{padding:24px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="brand" href="/"><span class="mark"></span>Dank Omphalos Arthouse</a>
  <a class="btn ghost" id="signout" href="#" style="display:none">Sign out</a>
</div></header>
<main id="app"><div class="wrap"><p class="lead" style="padding-top:40px">Loading…</p></div></main>
<footer><div class="wrap">Planar Gate · Dank Omphalos Arthouse</div></footer>

<script type="module">
/* ===========================================================================
   Artist Portal — Neon Auth (Better Auth, email + password) + Neon Data API.
   Standalone on purpose: separate from the marketing index.html so untested
   auth can never break the live gallery. Errors render on-page for debugging.

   SETUP: add this page's URL to Neon Auth "trusted origins / redirect URLs",
   and (if needed) paste the publishable client key below.
   =========================================================================== */
const CONFIG = {
  dataApiUrl: "https://ep-red-sea-a6sf5y3d.apirest.us-west-2.aws.neon.tech/neondb/rest/v1",
  authUrl:    "https://ep-red-sea-a6sf5y3d.neonauth.us-west-2.aws.neon.tech/neondb/auth",
  publishableKey: ""   // <<< paste your Neon Auth publishable client key (if your setup needs it)
};

const app = document.getElementById("app");
const signoutBtn = document.getElementById("signout");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => Number(v)||0;
const money = n => "£"+Math.round(num(n)).toLocaleString("en-GB");
const fmtDate = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "—";
const cap = s => (s||"").charAt(0).toUpperCase()+(s||"").slice(1);
const fail = (msg) => { signoutBtn.style.display="none"; app.innerHTML =
  `<div class="wrap" style="padding-top:40px"><h2 style="font-family:var(--serif);font-weight:500">This needs a tweak</h2>
   <p class="lead">Paste this to your developer and it'll be a quick fix:</p><div class="err">${esc(msg)}</div></div>`; };

let authClient = null;
let PROFILE = null;
async function loadAuth(){
  const core = await import("https://esm.sh/better-auth/client");
  authClient = core.createAuthClient({ baseURL: CONFIG.authUrl });
}

// Neon Data API needs a JWT. Better Auth issues one — exact accessor verified on first live test.
async function getToken(){
  // The Data API needs a signed JWT (verified via the project's JWKS) — NOT the
  // opaque Better Auth session token. The JWT plugin mints one at /token.
  const r = await fetch(CONFIG.authUrl + "/token", { credentials: "include" });
  const hdr = r.headers.get("set-auth-jwt");
  const body = await r.text();
  console.log("/token", r.status, "header:", hdr, "body:", body.slice(0,200));
  if (hdr) return hdr;
  if (!r.ok) throw new Error("Auth /token " + r.status + ": " + body.slice(0,300));
  let j = {}; try { j = JSON.parse(body); } catch(_){}
  const t = j.token || j.jwt || j.access_token || "";
  if (!t) throw new Error("Auth /token returned no JWT. Body: " + body.slice(0,300));
  return t;
}

// One door to the Data API. Adds the JWT (+ optional apikey); throws readable errors.
async function api(path, opts){
  opts = opts || {};
  const token = await getToken();
  const headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers || {});
  if (CONFIG.publishableKey) headers["apikey"] = CONFIG.publishableKey;
  if (opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
  const res = await fetch(CONFIG.dataApiUrl + path, Object.assign({}, opts, { headers }));
  const text = await res.text();
  if (!res.ok) throw new Error("Data API " + res.status + ": " + text.slice(0,400));
  return text ? JSON.parse(text) : null;
}

// The logged-in artist's own row (RLS returns only theirs). null if not linked yet.
async function fetchProfile(){
  const rows = await api("/artists?select=*");
  if (!Array.isArray(rows)) throw new Error("Profile call returned an unexpected shape:\n" + JSON.stringify(rows).slice(0,300));
  return rows[0] || null;
}

async function fetchPieces(){
  return api("/artist_pieces?select=*");
}

// Save the editable profile fields (PATCH the artist's own row; RLS + column grants
// keep them out of share/payout). Returns the updated row.
async function saveProfile(body){
  if (!PROFILE || !PROFILE.id) throw new Error("No linked artist profile to save to.");
  const rows = await api("/artists?id=eq." + encodeURIComponent(PROFILE.id), {
    method: "PATCH",
    headers: { "Prefer": "return=representation" },
    body: JSON.stringify(body)
  });
  const row = Array.isArray(rows) ? rows[0] : rows;
  if (row) PROFILE = row;
  return PROFILE;
}

function renderLogin(mode){
  signoutBtn.style.display = "none";
  const isUp = mode === "up";
  app.innerHTML = `<section class="block"><div class="wrap" style="max-width:440px">
    <div class="portal-head"><h2 class="pg-title">Planar Gate</h2><p class="pg-sub">Artist Portal</p></div>
    <p class="lead">See your stock with Dank Omphalos — what's held for you, what you're owed, and how long each piece has been here.</p>
    <p class="muted" style="font-size:13px;margin:-12px 0 18px">Invite-only — use the email Dank Omphalos has on file for you.</p>
    <form id="login">
      <input id="email" type="email" required placeholder="you@email.com" autocomplete="email" />
      <input id="password" type="password" required minlength="8" placeholder="${isUp?"Choose a password (8+ characters)":"Password"}" autocomplete="${isUp?"new-password":"current-password"}" />
      <button class="btn" type="submit">${isUp?"Create my login":"Sign in"}</button>
    </form>
    <p class="muted" style="font-size:13px;margin-top:14px">${isUp?`Already set up? <a href="#" id="toggle">Sign in</a>`:`First time here? <a href="#" id="toggle">Create your login</a>`}</p>
    <div id="msg" style="margin-top:14px"></div>
  </div></section>`;
  document.getElementById("toggle").addEventListener("click",(e)=>{ e.preventDefault(); renderLogin(isUp?"in":"up"); });
  document.getElementById("login").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = e.target.querySelector("button"); const orig = btn.textContent; btn.textContent="…"; btn.disabled = true;
    const msg = document.getElementById("msg");
    try {
      const res = isUp
        ? await authClient.signUp.email({ email, password, name: email.split("@")[0] })
        : await authClient.signIn.email({ email, password });
      console.log(isUp?"signUp.email":"signIn.email", res);
      if (res && res.error){ btn.textContent=orig; btn.disabled=false;
        msg.innerHTML = `<div class="err">${esc(res.error.message || JSON.stringify(res.error))}</div>`; return; }
      await afterAuth();
    } catch(err){ console.error(err); btn.textContent=orig; btn.disabled=false;
      msg.innerHTML = `<div class="err">${esc(err && (err.message||err.stack) || String(err))}\n\n(A CORS/network error means this page's URL isn't a trusted origin yet.)</div>`; }
  });
}

async function afterAuth(){
  let s; try { s = await authClient.getSession(); } catch(e){ return fail("getSession failed:\n"+(e&&e.message||e)); }
  const d = s && (s.data || s); const user = d && d.user;
  if (user) routeIn(); else renderLogin("in");
}

// Signed in: load the profile, then send first-timers through setup, others to the dashboard.
async function routeIn(){
  signoutBtn.style.display = "";
  app.innerHTML = `<div class="wrap"><p class="lead" style="padding-top:40px">Loading your account…</p></div>`;
  try { PROFILE = await fetchProfile(); }
  catch(err){ console.error(err); return fail("Couldn't load your profile from the Data API:\n" + (err && err.message || err)
     + "\n\n(Most often the token step or RLS — confirm the artist's user_id is linked to their row.)"); }
  if (!PROFILE) return fail("You're signed in, but no artist profile is linked to this login yet.\n\n"
     + "(Ask Dank Omphalos to confirm your invite — the email on file must match this account.)");
  if (!PROFILE.onboarded_at) renderOnboarding("welcome"); else renderDashboard();
}

// The fields an artist controls — each can be shown on the public gallery or kept private.
const PROFILE_FIELDS = [
  { key:"name",      label:"Display name", type:"text",     ph:"The name you sign your work with" },
  { key:"location",  label:"Location",     type:"text",     ph:"City, Country" },
  { key:"instagram", label:"Instagram",    type:"text",     ph:"https://instagram.com/yourhandle" },
  { key:"website",   label:"Website",      type:"text",     ph:"https://…" },
  { key:"bio",       label:"Short bio",    type:"textarea", ph:"A line or two about you and your work" }
];

function renderOnboarding(mode){
  signoutBtn.style.display = "";
  const isWelcome = mode === "welcome";
  const vis = (PROFILE && PROFILE.visibility) || {};
  const val = k => (PROFILE && PROFILE[k] != null) ? PROFILE[k] : "";
  // default new artists to sharing; respect saved choices on edit
  const shown = k => isWelcome ? (vis[k] !== false) : (vis[k] === true);

  const fields = PROFILE_FIELDS.map(f=>{
    const input = f.type === "textarea"
      ? `<textarea id="f_${f.key}" placeholder="${esc(f.ph)}">${esc(val(f.key))}</textarea>`
      : `<input type="text" id="f_${f.key}" value="${esc(val(f.key))}" placeholder="${esc(f.ph)}" />`;
    return `<div class="fld">
      <div class="fld-top">
        <label for="f_${f.key}">${esc(f.label)}</label>
        <label class="vis"><input type="checkbox" id="v_${f.key}" ${shown(f.key)?"checked":""}/> Show on gallery</label>
      </div>${input}</div>`;
  }).join("");

  app.innerHTML = `<section class="block"><div class="wrap" style="max-width:560px">
    <div class="portal-head"><h2 class="pg-title">${isWelcome?"Welcome":"Edit profile"}</h2>
      <p class="pg-sub">${isWelcome?"Set up your profile":"Your public details"}</p></div>
    <p class="lead">${isWelcome
      ? "Tell collectors who's behind the work. Tick <em>Show on gallery</em> for anything you'd like public on Dank Omphalos — untick to keep it to your portal only. You can change any of this later."
      : "Update your details and choose what's shown on the public gallery. Your stock and payout figures are never public."}</p>
    <form id="setup">${fields}
      <button class="btn" type="submit">${isWelcome?"Save & enter":"Save changes"}</button>
      ${isWelcome?"":`<a href="#" id="cancel" class="btn ghost" style="margin-left:10px">Cancel</a>`}
    </form>
    <div id="msg" style="margin-top:16px"></div>
  </div></section>`;

  if (!isWelcome) document.getElementById("cancel").addEventListener("click",(e)=>{ e.preventDefault(); renderDashboard(); });
  document.getElementById("setup").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector("button[type=submit]"); const orig = btn.textContent;
    btn.textContent = "…"; btn.disabled = true;
    const msg = document.getElementById("msg");
    const body = {}, visibility = {};
    PROFILE_FIELDS.forEach(f=>{
      const el = document.getElementById("f_"+f.key);
      let v = el ? el.value.trim() : "";
      body[f.key] = v === "" ? null : v;
      visibility[f.key] = document.getElementById("v_"+f.key).checked;
    });
    body.visibility = visibility;
    if (isWelcome) body.onboarded_at = new Date().toISOString();
    try {
      await saveProfile(body);
      renderDashboard();
    } catch(err){ console.error(err); btn.textContent = orig; btn.disabled = false;
      msg.innerHTML = `<div class="err">${esc(err && (err.message||err) )}\n\n(If this mentions permission/column, the Data API column grants in schema.sql may need a run.)</div>`; }
  });
}

async function renderDashboard(){
  signoutBtn.style.display = "";
  app.innerHTML = `<div class="wrap"><p class="lead" style="padding-top:40px">Loading your account…</p></div>`;
  let rows;
  try { rows = await fetchPieces(); }
  catch(err){ console.error(err); return fail("Couldn't load your pieces from the Data API:\n" + (err && err.message || err)
     + "\n\n(Most often the token step or RLS — confirm the artist's user_id is linked.)"); }
  if (!Array.isArray(rows)) return fail("Data API returned an unexpected shape:\n" + JSON.stringify(rows).slice(0,400));

  const held = rows.filter(r=>r.status!=="sold");
  const settled = rows.filter(r=>r.status==="sold");
  const totRetail = held.reduce((s,r)=>s+num(r.list_price),0);
  const totAdvance = held.reduce((s,r)=>s+num(r.advance),0);
  const cashOut = held.reduce((s,r)=>s+num(r.owed_on_sale),0);
  const who = esc((PROFILE && PROFILE.name) || "Your account");

  const heldRows = held.map(r=>`<tr>
      <td>${esc(r.title)}<br><span class="sub">${r.kind==="alter"?"Alter":"Original"}</span></td>
      <td>${fmtDate(r.date_added)}</td><td class="muted">${num(r.days_held)} days</td>
      <td>${esc(cap(r.status))}</td><td>${money(r.list_price)}</td>
      <td class="muted">${money(r.advance)}</td><td class="owed">${money(r.owed_on_sale)}</td></tr>`).join("");

  app.innerHTML = `<div class="wrap">
    <div class="portal-head" style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
      <h2>${who} — your account</h2>
      <a href="#" id="editprofile" class="muted" style="font-size:13px;white-space:nowrap">Edit profile</a></div>
    <p class="lead">You were paid an advance up front on each piece. When one sells you receive the rest — the lion's share of retail. No clock, no auction: your work waits for the right buyer. Want your money sooner? Ask us about a cash-out anytime.</p>
    <div class="summary">
      <div class="stat"><p class="n">${held.length}</p><p class="l">Pieces held</p></div>
      <div class="stat"><p class="n">${money(totRetail)}</p><p class="l">Retail value held</p></div>
      <div class="stat"><p class="n">${money(totAdvance)}</p><p class="l">Advances received</p></div>
      <div class="stat hl"><p class="n">${money(cashOut)}</p><p class="l">Cash-out available now</p></div>
    </div>
    <div class="head"><h2 style="font-size:22px">Your stock with Omphalos</h2></div>
    ${ held.length ? `<table class="ledger"><tr><th>Piece</th><th>Added</th><th>Held</th><th>Status</th><th>List</th><th>Advance</th><th>Owed on sale</th></tr>${heldRows}</table>` : `<p class="lead">Nothing held right now.</p>` }
    ${ settled.length ? `<div class="head" style="margin-top:30px"><h2 style="font-size:22px">Settled</h2></div>
       <table class="ledger"><tr><th>Piece</th><th>Added</th><th>List</th><th>Paid in full</th></tr>
       ${settled.map(r=>`<tr><td>${esc(r.title)}</td><td>${fmtDate(r.date_added)}</td><td>${money(r.list_price)}</td><td class="owed">${money(r.artist_share_value)}</td></tr>`).join("")}</table>` : "" }
    <p class="muted" style="font-size:12px;margin-top:24px">Live from your Neon account · figures per your agreement.</p>
  </div>`;
  const ep = document.getElementById("editprofile");
  if (ep) ep.addEventListener("click",(e)=>{ e.preventDefault(); renderOnboarding("edit"); });
}

signoutBtn.addEventListener("click", async (e)=>{ e.preventDefault(); try{ await authClient.signOut(); }catch(_){ } renderLogin("in"); });

async function init(){
  try { await loadAuth(); }
  catch(e){ console.error(e); return fail("Couldn't load the auth library from the CDN (better-auth import):\n"
     + (e && e.message || e) + "\n\n(We may need to pin a version or change the esm.sh path.)"); }
  let session;
  try { session = await authClient.getSession(); }
  catch(e){ console.error(e); return fail("auth.getSession() failed:\n" + (e && e.message || e)); }
  const d = session && (session.data || session);
  const user = d && d.user;
  if (user) routeIn(); else renderLogin("in");
}
init();
</script>
</body>
</html>
